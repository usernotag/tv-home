name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK manually
        run: |
          cd launcher
          sed -i '/adb install/d' build-and-install.sh
          sed -i '/adb shell/d' build-and-install.sh
          bash build-and-install.sh || true

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: "**/*.apk"

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with author script
        run: |
          cd launcher
          chmod +x build-and-install.sh
          bash build-and-install.sh --build-only || bash build-and-install.sh compile || bash build-and-install.sh

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: launcher/**/*.apk
